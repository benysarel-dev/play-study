<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inscription | APJ/LBP</title>

<link rel="stylesheet" href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="auth-wrapper">

<div class="auth-card">

<a href="index.html" class="auth-logo">
<h1>APJ/LBP</h1>
</a>

<p class="auth-subtitle">Créez votre compte et commencez à apprendre en jouant.</p>

<form id="signupForm">

<label for="role">Je suis</label>
<select id="role">
<option>Élève</option>
<option>Enseignant</option>
<option>Didacticien</option>
<option>Parent</option>
</select>

<label for="name">Nom complet</label>
<input type="text" id="name" placeholder="Votre nom" required>

<label for="email">Adresse e-mail</label>
<input type="email" id="email" placeholder="vous@exemple.com" required>

<label for="password">Mot de passe</label>
<input type="password" id="password" placeholder="••••••••" required>

<label for="confirm">Confirmer le mot de passe</label>
<input type="password" id="confirm" placeholder="••••••••" required>

<label class="remember terms">
<input type="checkbox" required> J'accepte les conditions d'utilisation
</label>

<button type="submit">Créer mon compte</button>

</form>

<div class="auth-divider"><span>ou</span></div>

<button class="google-btn">🔵 Continuer avec Google</button>

<p class="auth-switch">
Déjà inscrit(e) ? <a href="connexion.html">Connectez-vous</a>
</p>

</div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", function(e){

e.preventDefault();

const pass = document.getElementById("password").value;

const confirm = document.getElementById("confirm").value;

if(pass !== confirm){

alert("Les mots de passe ne correspondent pas.");

return;

}

window.location.href = "dashboard.html";

});

</script>

</body>
</html>
