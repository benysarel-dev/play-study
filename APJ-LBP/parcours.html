<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcours Intelligent - APJ/LBP</title>

<link rel="stylesheet" href="css/parcours.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<h1>🎯 Parcours Intelligent APJ/LBP</h1>

<p>
Une notion. Plusieurs jeux didactiques.
</p>

<div class="wizard">

<div class="step">

<h2>1. Choisissez le niveau</h2>

<select>

<option>Préscolaire</option>

<option>Primaire</option>

<option>Secondaire Général</option>

<option>Technique et Professionnel</option>

<option>Enseignement Supérieur</option>

</select>

</div>

<div class="step">

<h2>2. Discipline</h2>

<select>

<option>Mathématiques</option>

<option>Français</option>

<option>Anglais</option>

<option>Sciences</option>

<option>Histoire</option>

<option>Informatique</option>

</select>

</div>

<div class="step">

<h2>3. Notion</h2>

<input
type="text"
placeholder="Ex : Les fractions">

</div>

<button id="generate">

🤖 Générer les jeux

</button>

</div>

<div id="games">

</div>

</div>

<script src="js/parcours.js"></script>

</body>
</html>
