<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Connexion | APJ/LBP</title>

<link rel="stylesheet" href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="auth-wrapper">

<div class="auth-card">

<a href="index.html" class="auth-logo">
<h1>APJ/LBP</h1>
</a>

<p class="auth-subtitle">Content de vous revoir ! Connectez-vous pour continuer.</p>

<form id="loginForm">

<label for="email">Adresse e-mail</label>
<input type="email" id="email" placeholder="vous@exemple.com" required>

<label for="password">Mot de passe</label>
<input type="password" id="password" placeholder="••••••••" required>

<div class="auth-options">
<label class="remember">
<input type="checkbox"> Se souvenir de moi
</label>
<a href="#" class="forgot">Mot de passe oublié ?</a>
</div>

<button type="submit">Se connecter</button>

</form>

<div class="auth-divider"><span>ou</span></div>

<button class="google-btn">🔵 Continuer avec Google</button>

<p class="auth-switch">
Pas encore de compte ? <a href="inscription.html">Inscrivez-vous</a>
</p>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

window.location.href = "dashboard.html";

});

</script>

</body>
</html>
